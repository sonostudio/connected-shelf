detection:
  confidence_threshold: 0.80
  model_path: "model/model_shoes.blob"
  labels_path: "model/labels.txt"
  camera_fps: 30

display:
  resolution: [1920, 1080] # [width, height]
  fullscreen: true
  fps: 30

transitions:
  fade_duration: 0.5
  return_to_default_delay: 0.0

content:
  default: "../videos/default.mp4"
  skus:
    nike_black: "../videos/nike_black.mov"
    nb_gray: "../videos/nb_gray.mp4"

video:
  loop: true
  preload: true # Preload all videos at startup (faster switching)

logging:
  level: "INFO"
