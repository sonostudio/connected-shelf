detection:
  confidence_threshold: 0.8   # Mac side: gates video switching
  pre_filter_threshold: 0.1   # Pi side: strips obvious noise before OSC send
  model_path: "model/model.blob"
  labels_path: "model/labels.txt"
  camera_fps: 30
  preview: false

display:
  resolution: [1920, 1080] # [width, height]
  fullscreen: true
  fps: 30

transitions:
  fade_duration: 0.5
  return_to_default_delay: 0.0

content:
  default: "videos/idle-4K.mp4"
  skus:
    nb: "videos/abstract-01-4K.mp4"
    nike: "videos/cosmos-01-4K.mp4"
    puma: "videos/cosmos-01-4K.mp4"

video:
  loop: true
  preload: true # Preload all videos at startup (faster switching)

osc:
  mac_ip: "192.168.1.4"
  port: 9000
  send_interval: 0.05
  no_detection_timeout: 2.0  # Mac: seconds without a message before returning to default

logging:
  level: "INFO"
